<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Mai ❤️</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0a192f; overflow-x: hidden; }
        
        /* تأثير النجوم */
        .stars { position: fixed; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .star { position: absolute; background: white; border-radius: 50%; animation: float 6s linear infinite; }
        @keyframes float { 0% { transform: translateY(100vh); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-10vh); opacity: 0; } }

        .screen { display: none; width: 100%; min-height: 100vh; position: absolute; top: 0; left: 0; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 2; text-align: center; }
        .active { display: flex !important; }

        /* شاشة الدخول - أزرق فاتح */
        #welcome-screen { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; }
        /* الشاشات الداخلية - لبني هادي */
        .inner-screen { background: linear-gradient(135deg, #e0f2fe, #bae6fd); color: #1e293b; }

        .card { background: rgba(255, 255, 255, 0.9); padding: 30px; border-radius: 25px; box-shadow: 0 10px 35px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        .name-title { font-size: 5rem; font-weight: bold; margin-bottom: 20px; }
        
        .btn { background-color: #0284c7; color: white; border: none; padding: 12px 40px; font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer; margin-top: 20px; }
        .btn-continue { background-color: white; color: #1e3a8a; }

        .timer-box { font-size: 1.4rem; font-weight: bold; color: #0369a1; margin: 15px 0; line-height: 1.6; }
        .love-letter { font-size: 1.1rem; line-height: 1.8; color: #334155; margin: 20px 0; background: rgba(2, 132, 199, 0.05); padding: 15px; border-radius: 15px; border-right: 4px solid #0284c7; text-align: right; }
        
        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .gallery img { width: 100%; height: 140px; object-fit: cover; border-radius: 15px; }
    </style>
</head>
<body>

    <div class="stars" id="starsBox"></div>

    <!-- الشاشة 1: الدخول -->
    <div id="welcome-screen" class="screen active">
        <div class="name-title">Mai</div>
        <button class="btn btn-continue" onclick="goNext()">Continue</button>
    </div>

    <!-- الشاشة 2: العداد والرسالة -->
    <div id="counter-screen" class="screen inner-screen">
        <div class="card">
            <h2>تاريخ أول لقاء جمعنا 📅</h2>
            <p style="color: #64748b;">عرفتك في يوم: <span id="start-date-text"></span></p>
            <div id="timer" class="timer-box">جاري الحساب...</div>
            <div class="love-letter">
                عايز اقولك مهما بعدنا هفضل احبك لاني اول مره الاحساس دا احسو مع حد بحبك جدا وهفضل احبك عمري كلو ي كل عمري وربنا يخليكي ليا ونفضل سوا ي حبيبت عيني بحبك لاخر عمري ❤️
            </div>
            <button class="btn" onclick="goPhotos()">Next</button>
        </div>
    </div>

    <!-- الشاشة 3: الصور -->
    <div id="photos-screen" class="screen inner-screen">
        <div class="card">
            <h2>ألبوم ذكرياتنا الصغير 📸</h2>
            <div class="gallery">
                <img src="pic1.jpg" alt="1">
                <img src="pic2.jpg" alt="2">
                <img src="pic3.jpg" alt="3">
                <img src="pic4.jpg" alt="4">
            </div>
            <button class="btn" style="background-color: #64748b;" onclick="goBack()">رجوع</button>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        // النجوم
        const box = document.getElementById('starsBox');
        for (let i = 0; i < 30; i++) {
            let s = document.createElement('div');
            s.className = 'star';
            s.style.left = (Math.random() * 100) + "vw";
            s.style.animationDelay = (Math.random() * 5) + "s";
            s.style.width = s.style.height = (2 + Math.random() * 3) + "px";
            box.appendChild(s);
        }

        // أزرار التنقل
        function goNext() {
            document.getElementById('welcome-screen').classList.remove('active');
            document.getElementById('counter-screen').classList.add('active');
            // تشغيل الأغنية
            var audio = document.getElementById('bg-music');
            audio.play().catch(function(e){ console.log(e) });
        }

        function goPhotos() {
            document.getElementById('counter-screen').classList.remove('active');
            document.getElementById('photos-screen').classList.add('active');
        }

        function goBack() {
            document.getElementById('photos-screen').classList.remove('active');
            document.getElementById('counter-screen').classList.add('active');
        }

        // التاريخ والعداد (17/5/2025)
        const d = new Date(2025, 4, 17); // شهر مايو ترتيبه 4 في البرمجة
        document.getElementById('start-date-text').innerText = "17/5/2025";

        setInterval(function() {
            const diff = new Date() - d;
            const days = Math.floor(diff / 86400000);
            const hours = Math.floor((diff % 86400000) / 3600000);
            const minutes = Math.floor((diff % 3600000) / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);
            document.getElementById("timer").innerHTML = "بقالنا سوا:<br>✨ " + days + " يوم <br>⏰ " + hours + " ساعة و " + minutes + " دقيقة و " + seconds + " ثانية";
        }, 1000);
    </script>
</body>
</html>
