<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Mai ❤️</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(135deg, #020617 0%, #0f172a 40%, #1e3a8a 100%); 
            background-attachment: fixed;
            overflow-x: hidden; 
        }
        
        /* نظام النجوم اللامعة */
        .stars { position: fixed; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .star { position: absolute; background: #ffffff; border-radius: 50%; animation: float 6s linear infinite; box-shadow: 0 0 8px #ffffff; }
        @keyframes float { 
            0% { transform: translateY(100vh) scale(0); opacity: 0; } 
            50% { opacity: 1; } 
            100% { transform: translateY(-10vh) scale(1); opacity: 0; } 
        }

        .screen { display: none; width: 100%; min-height: 100vh; position: absolute; top: 0; left: 0; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 2; text-align: center; }
        .active { display: flex !important; }

        #welcome-screen { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; }

        .content-wrapper { 
            max-width: 550px; 
            width: 100%; 
            color: #ffffff;
            padding: 10px;
        }

        .name-title { font-size: 5rem; font-weight: bold; margin-bottom: 20px; text-shadow: 0 0 15px rgba(255,255,255,0.3); }
        
        .btn { background-color: #3b82f6; color: white; border: none; padding: 14px 50px; font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer; margin-top: 20px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .btn:hover { background-color: #2563eb; transform: translateY(-2px); }
        .btn-continue { background-color: white; color: #1e3a8a; box-shadow: 0 4px 15px rgba(255,255,255,0.2); }

        /* فريم الوقت الشفاف المحدث بحواف زرقاء بارزة */
        .timer-frame {
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            border-radius: 20px;
            padding: 15px 20px;
            margin: 20px 0;
            backdrop-filter: blur(2px);
        }

        /* تنسيق الأسطر المقسمة للوقت بخط أصغر وأرتب */
        .timer-box { font-size: 1.25rem; font-weight: bold; color: #60a5fa; line-height: 1.6; text-shadow: 0 0 10px rgba(96, 165, 250, 0.3); }
        .timer-days { font-size: 1.5rem; color: #ffffff; margin-bottom: 8px; font-weight: 800; display: block; }
        .timer-sub { font-size: 1.2rem; color: #93c5fd; display: block; }
        
        /* تنسيق الرسالة الطويلة بخط ناعم وجميل */
        .love-letter { 
            font-size: 1.2rem; 
            line-height: 2; 
            color: #f8fafc; 
            margin: 25px 0; 
            padding: 0 10px;
            text-align: right; 
            background: none;
            border: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        
        .gallery { 
            display: flex; 
            flex-direction: column; 
            gap: 25px; 
            margin-top: 25px; 
            width: 100%;
        }
                .gallery img { 
            width: 100%; 
            height: auto; 
            max-height: 450px;
            object-fit: contain; 
            border-radius: 20px; 
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 25px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            background: rgba(0, 0, 0, 0.2);
        }
        .gallery img:hover { transform: scale(1.02); }
    </style>

</head>
<body>

    <div class="stars" id="starsBox"></div>

    <!-- الشاشة 1: الدخول -->
    <div id="welcome-screen" class="screen active">
        <div class="name-title">Mai</div>
        <button class="btn btn-continue" onclick="goNext()">Continue</button>
    </div>

    <!-- الشاشة 2: الوقت والرسالة -->
    <div id="counter-screen" class="screen">
        <div class="content-wrapper">
            <h2 style="color: #60a5fa; margin-top: 0; font-size: 1.8rem; text-shadow: 0 2px 8px rgba(0,0,0,0.5);">تاريخ أول لقاء جمعنا 📅</h2>
            <p style="color: #cbd5e1; font-size: 1.05rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5); margin: 5px 0;">عرفتك في يوم: <span id="start-date-text"></span></p>
            
            <!-- فريم الوقت المقسوم والمرتب بخط شيك -->
            <div class="timer-frame">
                <div id="timer" class="timer-box">
                    <span class="timer-days" id="days-part">جاري الحساب...</span>
                    <span class="timer-sub" id="sub-part"></span>
                </div>
            </div>
            
            <!-- الرسالة الطويلة المنسقة -->
            <div class="love-letter">
                عايز اقولك مهما بعدنا هفضل احبك لاني اول مره الاحساس دا احسو مع حد بحبك جدا وهفضل احبك عمري كلو ي كل عمري وربنا يخليكي ليا ونفضل سوا ي حبيبت عيني بحبك لاخر عمري ❤️
            </div>
            
            <button class="btn" onclick="goPhotos()">Next</button>
        </div>
    </div>

    <!-- الشاشة 3: ألبوم الصور -->
        <!-- الشاشة 3: ألبوم الصور -->
    <div id="photos-screen" class="screen" style="overflow-y: auto; padding: 40px 20px;">
        <div class="content-wrapper">
            <h2 style="color: #60a5fa; margin-top: 0; font-size: 2rem; text-shadow: 0 2px 8px rgba(0,0,0,0.5);">ألبوم ذكرياتنا الصغير 📸</h2>
            
            <div class="gallery">
                <img src="8769389a-ace4-4a42-9042-24cb4bd1e8d3.jpeg" alt="ذكرياتنا 1">
                <img src="9f6e1918-184b-4c7d-8449-315e47806090.jpeg" alt="ذكرياتنا 2">
                <img src="bc1f4af7-96c2-4d4b-900b-4c5eb9664e57.jpeg" alt="ذكرياتنا 3">
                <img src="fdff31ee-5eed-4069-b941-fc5eb9664e57.jpeg" alt="ذكرياتنا 4">
            </div>
            
            <button class="btn" style="background-color: #475569;" onclick="goBack()">رجوع</button>
        </div>
    </div>


            <button class="btn" style="background-color: #475569;" onclick="goBack()">رجوع</button>


            </div>
            
            <button class="btn" style="background-color: #475569;" onclick="goBack()">رجوع</button>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        // توليد النجوم اللامعة
        const box = document.getElementById('starsBox');
        for (let i = 0; i < 40; i++) {
            let s = document.createElement('div');
            s.className = 'star';
            s.style.left = (Math.random() * 100) + "vw";
            s.style.animationDelay = (Math.random() * 5) + "s";
            s.style.animationDuration = (4 + Math.random() * 4) + "s";
            s.style.width = s.style.height = (2 + Math.random() * 3) + "px";
            box.appendChild(s);
        }

        function goNext() {
            document.getElementById('welcome-screen').classList.remove('active');
            document.getElementById('counter-screen').classList.add('active');
            var audio = document.getElementById('bg-music');
            if(audio) {
                audio.play().catch(function(e){ console.log(e) });
            }
        }

        function goPhotos() {
            document.getElementById('counter-screen').classList.remove('active');
            document.getElementById('photos-screen').classList.add('active');
            window.scrollTo(0,0);
        }

        function goBack() {
            document.getElementById('photos-screen').classList.remove('active');
            document.getElementById('counter-screen').classList.add('active');
        }

        // إعدادات العداد (17/5/2025)
        const d = new Date(2025, 4, 17); 
        document.getElementById('start-date-text').innerText = "17/5/2025";

        // كود العداد المحدث لفصل الأيام عن الساعات
        setInterval(function() {
            const diff = new Date() - d;
            const days = Math.floor(diff / 86400000);
            const hours = Math.floor((diff % 86400000) / 3600000);
            const minutes = Math.floor((diff % 3600000) / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);
            
            // حقن النص المقسم برمجياً في الأسطر المخصصة لها
            document.getElementById("days-part").innerHTML = "بقالنا سوا: ✨ " + days + " يوم";
            document.getElementById("sub-part").innerHTML = "⏰ " + hours + " ساعة و " + minutes + " دقيقة و " + seconds + " ثانية";
        }, 1000);
    </script>
</body>
</html>
